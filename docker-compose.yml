version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/vue-practice
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
